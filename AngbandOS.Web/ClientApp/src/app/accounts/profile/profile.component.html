<app-master-layout>
  @if (isAuthenticated){
    <form [formGroup]="formGroup">
      <h2>Account Details</h2>
      <mat-label>Username</mat-label>
      <mat-form-field id="username">
        <input matInput formControlName="username" placeholder="Username" />
      </mat-form-field>
      <mat-label>Email Address</mat-label>
      <mat-form-field id="email-address">
        <input matInput formControlName="emailAddress" placeholder="Email Address" />
      </mat-form-field>
    </form>
    <ng-template ngFor [ngForOf]="messages" let-message>
      <div class="mat-error">{{message}}</div>
    </ng-template>
    @if (formGroup.disabled) {
      <button mat-button mat-flat-button (click)="onEditClick()">Edit</button>
      @if (!emailVerified) {
        <button mat-button mat-flat-button (click)="onResendConfirmationEmailClick()">Resend Confirmation Email</button>
      }
    } @else {
      <button mat-button mat-flat-button (click)="onSaveClick()">Save</button>
      <button mat-button mat-flat-button (click)="onCancelClick()">Cancel</button>
    }
  } @else {
    You are not logged in.
  }
</app-master-layout>
