@if (activePropertyMetadataAndConfiguration !== undefined) {
  <table>
    <tbody>
      @for (entity of activePropertyMetadataAndConfiguration.configuration; track $index) {
      <tr>
        <td>
          {{getEntityName(entity)}}
        </td>
        <td>
          <mat-icon class="game-designer-delete-icon" (click)="deleteEntity($index)">delete</mat-icon>
        </td>
      </tr>
      }
    </tbody>
    <tfoot>
      <tr>
        <td [attr.colspan]="2">
          <mat-icon class="game-designer-add-icon" (click)="addEntity()">add</mat-icon>
        </td>
      </tr>
    </tfoot>
  </table>
}
