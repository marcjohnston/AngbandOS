<div id="container">
  <app-nav-menu></app-nav-menu>
  <h6 class="window-left-right-margins">Game Configuration Designer</h6>
  <div class="window-left-right-margins" *ngIf="gameConfiguration !== undefined">
    {{isModified ? '--MODIFIED--' : "--unchanged--"}}
  </div>
  <div id="component-window" class="window-left-right-margins">
    <ng-container *ngIf="rootTreeNodes !== undefined && gameConfiguration !== undefined && gamePropertyMetadata !== undefined">
      <div id="tree-panel">
        <table>
          <ng-container *ngFor="let treeNode of rootTreeNodes">
            <tr (click)="treeNodeClicked(treeNode)">
              <td (click)="treeNode.isOpen=!treeNode.isOpen">
                <ng-container *ngIf="treeNode.children != null">
                  <ng-container *ngIf="!treeNode.isOpen">
                    +
                  </ng-container>
                  <ng-container *ngIf="treeNode.isOpen">
                    -
                  </ng-container>
                </ng-container>
              </td>
              <td colspan="2">{{treeNode.title}}</td>
            </tr>
            <ng-container *ngIf="treeNode.children != null && treeNode.isOpen">
              <ng-container *ngFor="let childTreeNode of treeNode.children">
                <tr (click)="treeNodeClicked(childTreeNode)">
                  <td></td>
                  <td>-</td>
                  <td>{{childTreeNode.title}}</td>
                </tr>
              </ng-container>
            </ng-container>
          </ng-container>
        </table>
      </div>
      <div id="entity-panel">
        <ng-container *ngIf="selectedPropertyMetadataAndConfigurations !== null">
          <!-- Render all of metadatas and configurations for the selection.  The game settings will have multiple metadatas and configuraitons; everything else will have a single element -->
          <ng-container *ngFor="let propertyMetadataAndConfiguration of selectedPropertyMetadataAndConfigurations">
            <app-game-designer-property [propertyMetadataAndConfiguration]="propertyMetadataAndConfiguration" [gameConfiguration]="gameConfiguration" [gamePropertyMetadata]="gamePropertyMetadata" [enumMap]="enumMap"></app-game-designer-property>
          </ng-container>
        </ng-container>
      </div>
    </ng-container>
    <ng-container *ngIf="rootTreeNodes === undefined">
      loading ...
    </ng-container>
  </div>
  <app-footer></app-footer>
</div>
