<ng-container *ngIf="propertyMetadataAndConfiguration !== undefined">
  <table id="tuple-table">
    <thead>
      <tr>
        <!-- Tuple table header -->
        <ng-container *ngFor="let tupleType of propertyMetadataAndConfiguration.propertyMetadata.associatedProperties">
          <td>
            <span class="tuple-table-header">{{tupleType.renderTitle}}</span>
          </td>
        </ng-container>
        <td></td> <!-- Action icons -->
      </tr>
    </thead>
    <tbody>
      <!-- Tuple table rows of configuration values -->
      <ng-container *ngFor="let tupleValues of propertyMetadataAndConfiguration.configuration[propertyMetadataAndConfiguration.propertyMetadata.propertyName]; let index=index">
        <tr>
          <ng-container *ngFor="let tupleTypePropertyMetadata of propertyMetadataAndConfiguration.propertyMetadata.associatedProperties; let tupleIndex=index">
            <td>
              <app-game-designer-type [propertyMetadataAndConfiguration]="createTupleChild(tupleTypePropertyMetadata, tupleIndex, tupleValues)" [configuration]="configuration" [propertyMetadataMap]="propertyMetadataMap"></app-game-designer-type>
            </td>
          </ng-container>
          <td>
            <mat-icon class="game-designer-delete-icon" title="Delete this setting." (click)="deleteTuple(index)">delete</mat-icon>
          </td>
        </tr>
      </ng-container>
    </tbody>
    <ng-container *ngIf="propertyMetadataAndConfiguration.propertyMetadata.associatedProperties !== null">
      <tfoot>
        <tr>
          <td [attr.colspan]="propertyMetadataAndConfiguration.propertyMetadata.associatedProperties.length + 1">
            <mat-icon class="game-designer-add-icon" title="Add new setting." (click)="addTuple()">add</mat-icon>
          </td>
        </tr>
      </tfoot>
    </ng-container>
  </table>
</ng-container>
