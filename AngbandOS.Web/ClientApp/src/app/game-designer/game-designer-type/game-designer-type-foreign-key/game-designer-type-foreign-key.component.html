<div id="container" *ngIf="propertyMetadataAndConfiguration !== undefined">
  @if (true) {
    <div (click)="showDebug = !showDebug" style="color: white; background-color: black; width: fit-content">
      {{ showDebug ? '-' : '+' }} Debug
    </div>
    @if (showDebug) {
    <div style="background-color: #1e1e1e; padding: 10px; border: 1px solid #ddd; border-radius:8px; width: fit-content">
      Game Designer Property - Metadata
      <pre>{{propertyMetadataAndConfiguration.propertyMetadata | json}}</pre>
      Configuration
      <pre>{{propertyMetadataAndConfiguration.configuration | json}}</pre>
    </div>
    }
  }
  <div id="select-div">
    <select #select [ngModel]="getValue()" (change)="setValue()">
      <ng-container *ngIf="propertyMetadataAndConfiguration.propertyMetadata.labelIfNullable !== null">
        <option value="">{{propertyMetadataAndConfiguration.propertyMetadata.labelIfNullable}}</option>
      </ng-container>
      <ng-container *ngFor="let selectOption of selectOptions">
        <option value="{{selectOption.value}}">{{selectOption.text}}</option>
      </ng-container>
    </select>
    <span id="modified-span" *ngIf="unmodifiedValue !== getValue()"><mat-icon class="game-designer-undo-icon" (click)="undo()">undo</mat-icon></span>
  </div>
</div>
