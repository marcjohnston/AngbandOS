<ng-container *ngIf="propertyMetadataAndConfiguration !== undefined">
  <!-- Array -->
  <div class="array-div" *ngIf="propertyMetadataAndConfiguration.propertyMetadata.type === 'array'">
    <div class="array-item-div" *ngFor="let value of propertyMetadataAndConfiguration.configuration[propertyMetadataAndConfiguration.propertyMetadata.propertyName]; let valueIndex = index">
      <app-game-designer-type-foreign-key [propertyMetadataAndConfiguration]="createArrayChild(valueIndex)" [gameConfiguration]="gameConfiguration" [gamePropertyMetadata]="gamePropertyMetadata"></app-game-designer-type-foreign-key>
      <mat-icon class="game-designer-delete-icon" (click)="deleteArrayIndex(valueIndex)">delete</mat-icon>
    </div>
    <mat-icon class="game-designer-add-icon" (click)="appendArrayItem()">add</mat-icon>
  </div>
  <!-- Foreign Key -->
  <div *ngIf="propertyMetadataAndConfiguration.propertyMetadata.type === 'foreign-key'">
    <app-game-designer-type-foreign-key [propertyMetadataAndConfiguration]="propertyMetadataAndConfiguration" [gameConfiguration]="gameConfiguration" [gamePropertyMetadata]="gamePropertyMetadata"></app-game-designer-type-foreign-key>
  </div>
  <!-- TextArea -->
  <div *ngIf="propertyMetadataAndConfiguration.propertyMetadata.type === 'strings'">
    <app-game-designer-type-string-array [propertyMetadataAndConfiguration]="propertyMetadataAndConfiguration"></app-game-designer-type-string-array>
  </div>
  <!-- String -->
  <div *ngIf="propertyMetadataAndConfiguration.propertyMetadata.type === 'string'">
    <app-game-designer-type-string [propertyMetadataAndConfiguration]="propertyMetadataAndConfiguration"></app-game-designer-type-string>
  </div>
  <!-- Boolean -->
  <div *ngIf="propertyMetadataAndConfiguration.propertyMetadata.type === 'boolean'">
    <app-game-designer-type-boolean [propertyMetadataAndConfiguration]="propertyMetadataAndConfiguration"></app-game-designer-type-boolean>
  </div>
  <!-- Color -->
  <div *ngIf="propertyMetadataAndConfiguration.propertyMetadata.type === 'color'">
    <app-game-designer-type-color [propertyMetadataAndConfiguration]="propertyMetadataAndConfiguration"></app-game-designer-type-color>
  </div>
  <!-- Tuple  -->
  <div *ngIf="propertyMetadataAndConfiguration.propertyMetadata.type === 'tuple'">
    <app-game-designer-type-tuple-array [propertyMetadataAndConfiguration]="propertyMetadataAndConfiguration" [gameConfiguration]="gameConfiguration" [gamePropertyMetadata]="gamePropertyMetadata" [enumMap]="enumMap"></app-game-designer-type-tuple-array>
  </div>
  <!-- Integer -->
  <div *ngIf="propertyMetadataAndConfiguration.propertyMetadata.type === 'integer'">
    <app-game-designer-type-integer [propertyMetadataAndConfiguration]="propertyMetadataAndConfiguration"></app-game-designer-type-integer>
  </div>
  <!-- Character -->
  <div *ngIf="propertyMetadataAndConfiguration.propertyMetadata.type === 'character'">
    <app-game-designer-type-character [propertyMetadataAndConfiguration]="propertyMetadataAndConfiguration"></app-game-designer-type-character>
  </div>
  <!-- Enum -->
  <div *ngIf="propertyMetadataAndConfiguration.propertyMetadata.type === 'enum'">
    <app-game-designer-type-enum [propertyMetadataAndConfiguration]="propertyMetadataAndConfiguration" [gameConfiguration]="gameConfiguration" [gamePropertyMetadata]="gamePropertyMetadata" [enumMap]="enumMap"></app-game-designer-type-enum>
  </div>
</ng-container>
