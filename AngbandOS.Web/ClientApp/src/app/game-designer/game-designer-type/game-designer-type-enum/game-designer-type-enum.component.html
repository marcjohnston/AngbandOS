@if (activePropertyMetadataAndConfiguration !== undefined) {
  <div id="container">
    <div id="select-div">
      <select [ngModel]="getValue()"
              (ngModelChange)="setValue($event)">
        @if (activePropertyMetadataAndConfiguration.propertyMetadata.labelIfNullable !== null) {
        <option value="{{activePropertyMetadataAndConfiguration.propertyMetadata.labelIfNullable}}">
        </option>
        }
        <option *ngFor="let enumOption of options"
                [value]="enumOption.value">
          {{enumOption.name}}
        </option>
      </select>
      @if (unmodifiedValue !== getValue()) {
        <span id="modified-span">
          <mat-icon class="game-designer-undo-icon"
                    (click)="undo()">undo</mat-icon>
        </span>
    }
    </div>
  </div>
}
