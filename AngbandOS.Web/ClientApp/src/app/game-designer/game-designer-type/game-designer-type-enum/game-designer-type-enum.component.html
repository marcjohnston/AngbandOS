<div id="container" *ngIf="propertyMetadataAndConfiguration !== undefined">
  <div id="select-div">
    <select [ngModel]="getValue()" (ngModelChange)="setValue($event)">
      <option *ngIf="propertyMetadataAndConfiguration.propertyMetadata.labelIfNullable !== null"
              value="{{propertyMetadataAndConfiguration.propertyMetadata.labelIfNullable}}">
      </option>
      <option *ngFor="let enumOption of enumOptions" [value]="enumOption.value">
        {{enumOption.text}}
      </option>
    </select>
    <span id="modified-span" *ngIf="unmodifiedValue !== getValue()">
      <mat-icon class="game-designer-undo-icon" (click)="undo()">undo</mat-icon>
    </span>
  </div>
</div>
