@if (activePropertyMetadataAndConfiguration !== undefined) {
<div id="container">
  <div id="select-div">
    <select #select [ngModel]="getValue()" (change)="setValue()">
      @if (colorOptions !== undefined) {
        @if (activePropertyMetadataAndConfiguration.propertyMetadata.labelIfNullable !== null) {
        <option value="">{{activePropertyMetadataAndConfiguration.propertyMetadata.labelIfNullable}}</option>
        }
      <ng-container *ngFor="let selectOption of colorOptions">
        <option value="{{selectOption.value
            }}">
          {{selectOption.text}}
        </option>
      </ng-container>
      }
    </select>
    @if (unmodifiedValue !== getValue()) {
      <span id="modified-span"><mat-icon class="game-designer-undo-icon" (click)="undo()">undo</mat-icon></span>
    }
  </div>
  @if(errorMessage !== '') {
   <span class="game-designer-error-message-span">{{errorMessage}}</span>
  }
</div>
}
